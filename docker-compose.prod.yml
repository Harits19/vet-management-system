services:
  mongodb:
    image: mongo:7
    container_name: vet-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: vet-management

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vet-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://mongodb:27017/vet-management
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-password123}
      ENABLE_SEED: "true"
      COOKIE_SECURE: "true"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-https://wedi-animal-care.ahlabs.my.id}
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://wedi-animal-care.ahlabs.my.id}
    container_name: vet-frontend
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://wedi-animal-care.ahlabs.my.id}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: vet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
