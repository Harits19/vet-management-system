events {}

http {
  upstream frontend {
    server frontend:3002;
  }

  upstream backend {
    server backend:3001;
  }

  # ── Redirect HTTP → HTTPS ──
  server {
    listen 80 default_server;
    server_name wedi-animal-care.ahlabs.my.id _;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS Server ──
  server {
    listen 443 ssl http2;
    server_name wedi-animal-care.ahlabs.my.id;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Frontend ──
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend API ──
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ── Instance PORTOFOLIO (dev-animal-care.ahlabs.my.id) ──
  # HTTPS via Let's Encrypt (cert: ssl-dev/; renewal otomatis: certbot timer +
  # deploy-hook renew-ssl.sh). Container dev (vetdev-*) join network docker prod
  # → DNS internal langsung, TIDAK lewat port host (ufw host cuma buka 22/80/443).
  # Resolver dipakai supaya kalau stack dev mati → 502, nginx tetap start.

  # HTTP → HTTPS (challenge HTTP-01 tetap dilayani)
  server {
    listen 80;
    server_name dev-animal-care.ahlabs.my.id;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name dev-animal-care.ahlabs.my.id;

    ssl_certificate     /etc/nginx/ssl-dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl-dev/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=10s;

    location / {
      set $dev_frontend http://vetdev-frontend:3002;
      proxy_pass $dev_frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      set $dev_backend http://vetdev-backend:3001;
      proxy_pass $dev_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
