# Single compose file (production).
#   - Production: `docker compose up -d` — baca nilai dari .env (lihat .env.example)
#   - Dev laptop: `docker compose up -d mongodb` lalu `npm run dev`
# Semua nilai bisa di-override lewat .env; default di sini = aman untuk dev.
services:
  mongodb:
    image: mongo:7
    container_name: vet-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-127.0.0.1:27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_APP_DATABASE:-vet-management}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-dev-root-password}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-vetapp}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-dev-app-password}
      # Dipakai mongo-init.js (mongosh) — WAJIB sama dengan DB backend
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-vet-management}

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: vet-backend
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      MONGODB_HOST: mongodb
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-vetapp}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-dev-app-password}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-vet-management}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-password123}
      ENABLE_SEED: ${ENABLE_SEED:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3002}
      STORE_NAME: ${STORE_NAME:-Wedi Animal Care}
      STORE_ADDRESS: ${STORE_ADDRESS:-}
      STORE_WHATSAPP: ${STORE_WHATSAPP:-}
      STORE_PHONE: ${STORE_PHONE:-}
      OFFICE_LAT: ${OFFICE_LAT:-}
      OFFICE_LNG: ${OFFICE_LNG:-}
      OFFICE_RADIUS_METERS: ${OFFICE_RADIUS_METERS:-200}
      ATTENDANCE_FACE_THRESHOLD: ${ATTENDANCE_FACE_THRESHOLD:-0.6}
      ATTENDANCE_MODE: ${ATTENDANCE_MODE:-qr}
      ATTENDANCE_QR_SECRET: ${ATTENDANCE_QR_SECRET:-vet-attendance-2026}
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    container_name: vet-frontend
    restart: unless-stopped
    expose:
      - "3002"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: vet-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./ssl-dev:/etc/nginx/ssl-dev:ro
      - ./certbot-webroot:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
